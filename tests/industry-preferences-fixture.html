<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倾向行业离线验收</title><link rel="stylesheet" href="../plugin/ui.css"><link rel="stylesheet" href="../plugin/polish.css"><link rel="stylesheet" href="../plugin/button-tabs.css"><script>document.write('<link rel="stylesheet" href="preview/'+(new URL(location.href).searchParams.get('theme')==='dark'?'dark':'light')+'.css">');</script><style>html{background:var(--panel-bg)}</style></head><body class="settings-page"><main class="settings"><h1>账户配置 · 离线验收</h1><p>全部为合成测试数据，不会写插件、调用行情或发送消息。</p><div id="configuration"></div><pre id="acceptance-result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></main><script src="../plugin/core.js"></script><script src="../plugin/button-states.js"></script><script src="../plugin/config-form.js"></script><script>
'use strict';
const fixtureRows=Array.from({length:135},(_,i)=>({id:'BK'+(1000+i),name:i%9===0?'半导体材料行业 '+(i+1):i===1?'超长行业名称跨设备换行检查专用示例行业第二名':'示例行业 '+(i+1),amount:(135-i)*100000000,rank:i+1,asOf:Date.now()-60000,fetchedAt:Date.now()}));
const fixtureConfig={cash:10000,holdings:[],maxEquityWeight:.7,maxStockWeight:.2,maxIndustryWeight:.4,riskPerStock:.01,horizonDays:30,reviewMinutes:60,trackingEnabled:false,allowAutoRevision:true,industrySelectionMode:'hot120',industryIds:[],newsMaxAgeHours:48,quoteMaxAgeMinutes:20};
window.fixture={state:{mode:'live',simulation:false,revision:1,config:AShareCore.config(fixtureConfig)},calls:[],responses:[],catalogVersions:{live:1,simulation:1},failCatalog:false,holdNext:false,held:null};
const request=async(operation,args={},mode)=>{fixture.calls.push({operation,args:structuredClone(args),mode});if(operation==='list_industries'){if(fixture.holdNext){fixture.holdNext=false;await new Promise(resolve=>fixture.held=resolve);}if(fixture.failCatalog)throw new Error('离线目录失败样例');if(args.refresh)fixture.catalogVersions[mode]=(fixture.catalogVersions[mode]||0)+1;const catalogToken='fixture-catalog-'+mode+'-'+(fixture.catalogVersions[mode]||1);if(args.catalogToken&&args.catalogToken!==catalogToken)throw new Error('离线目录快照不匹配');fixture.responses.push({mode,catalogToken,args:structuredClone(args)});const all=fixtureRows.filter(r=>!args.search||r.id.toLowerCase().includes(args.search.toLowerCase())||r.name.includes(args.search)),offset=args.offset||0,rows=all.slice(offset,offset+(args.limit||30));return {catalogToken,industries:rows,total:all.length,nextOffset:offset+rows.length<all.length?offset+rows.length:null,source:'eastmoney-industry',fetchedAt:Date.now(),ranking:{metric:'amount',limit:120,complete:true}};}if(operation==='configure'){fixture.state={...fixture.state,revision:fixture.state.revision+1,config:structuredClone(args.config)};return {configured:true};}if(operation==='get_state')return structuredClone(fixture.state);if(operation==='list_partners')return {targets:[]};throw Error('unexpected fixture operation '+operation);};
window.editor=AShareConfigEditor.mount(document.querySelector('#configuration'),{request});editor.setState(fixture.state);
window.fixtureReady=true;
</script></body></html>
